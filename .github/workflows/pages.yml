name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start isolated Supabase services
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/supabase-start.log 2>&1 || { tail -n 40 /tmp/supabase-start.log; exit 1; }
      - run: supabase test db
      - name: Configure isolated browser tests
        run: |
          supabase status -o json 2>/dev/null | node -e '
          const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(0,"utf8"));
          const key=s.PUBLISHABLE_KEY||s.ANON_KEY;
          fs.writeFileSync(".env.local",`VITE_SUPABASE_URL=${s.API_URL}\nVITE_SUPABASE_PUBLISHABLE_KEY=${key}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV,`ACCOUNT_TEST_SUPABASE_URL=${s.API_URL}\nACCOUNT_TEST_DB_CONTAINER=supabase_db_tcg-game-builder\n`);
          '
      - run: npx playwright install --with-deps chromium
      - name: Test account sync against isolated Supabase
        run: npm run test:e2e -- tests/e2e/account.spec.ts
        env:
          CI: '1'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build -- --base=/tcg-builder-lab/
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: Test the production site
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREVIEW: '1'
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, database]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
